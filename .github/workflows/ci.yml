name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

jobs:
  shellcheck:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: bash -n netbird-delayed-update-macos.sh

      - name: Install ShellCheck
        run: brew install shellcheck

      - name: ShellCheck
        run: shellcheck --severity=error netbird-delayed-update-macos.sh

  smoke-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make executable
        run: chmod +x netbird-delayed-update-macos.sh

      - name: Run once (NetBird not installed -> should exit cleanly)
        run: sudo ./netbird-delayed-update-macos.sh --max-random-delay-seconds 0

      - name: Install LaunchDaemon
        run: sudo ./netbird-delayed-update-macos.sh --install --label "io.nethorror.ci-test" --max-random-delay-seconds 0

      - name: Verify LaunchDaemon was created
        run: sudo launchctl print system/io.nethorror.ci-test

      - name: Uninstall LaunchDaemon
        run: sudo ./netbird-delayed-update-macos.sh --uninstall --remove-state --label "io.nethorror.ci-test"

      - name: Verify LaunchDaemon was removed
        run: |
          if sudo launchctl print system/io.nethorror.ci-test >/dev/null 2>&1; then
            echo "LaunchDaemon still present after uninstall" >&2
            exit 1
          fi

  tag-matches-version:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          tag="${GITHUB_REF_NAME#v}"
          if ! grep -q "SCRIPT_VERSION=\"${tag}\"" netbird-delayed-update-macos.sh; then
            echo "Tag '${tag}' does not match SCRIPT_VERSION in netbird-delayed-update-macos.sh" >&2
            exit 1
          fi
